<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác minh OTP - FaceID System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --gray: #6b7280;
      --success: #16a34a;
      --danger: #dc2626;
      --info: #0ea5e9;
    }

    body {
      background: linear-gradient(135deg, #f3f4f6 0%, #e0ecff 100%);
      font-family: "Inter", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .verify-card {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      text-align: center;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-logo {
      font-size: 2rem;
      color: var(--primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .brand-logo i {
      margin-right: 0.5rem;
    }

    .form-control {
      padding: 0.75rem 1rem;
      font-size: 1.3rem;
      text-align: center;
      letter-spacing: 4px;
      font-weight: 600;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.25);
    }

    .btn-primary {
      background-color: var(--primary);
      border: none;
      font-weight: 500;
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
    }

    .footer {
      text-align: center;
      font-size: 0.9rem;
      color: var(--gray);
      margin-top: 1.5rem;
    }

    .alert {
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
    }
  </style>
</head>
<body>
  <div class="verify-card">
    <div class="brand-logo">
      <i class="fa-solid fa-shield-halved"></i> FaceID
    </div>
    <h4 class="fw-semibold mb-2">Xác minh bảo mật</h4>
    <p class="text-muted mb-4">Nhập mã OTP 6 chữ số từ ứng dụng Google Authenticator để tiếp tục.</p>

    <!-- Hiển thị thông báo flash -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Form nhập OTP -->
    <form method="POST" action="{{ url_for('auth_bp.verify_2fa') }}">
      <div class="mb-3">
        <input type="text" name="otp" maxlength="6" minlength="6" pattern="[0-9]{6}"
               class="form-control text-center" placeholder="••••••" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="fa-solid fa-lock-open me-2"></i>Xác minh
      </button>
    </form>

    <div class="footer mt-4">
      <a href="{{ url_for('auth_bp.login') }}" class="text-decoration-none text-muted">
        <i class="fa-solid fa-arrow-left me-1"></i>Quay lại đăng nhập
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Tự động focus vào ô OTP & chỉ cho nhập số
    const otpInput = document.querySelector('input[name="otp"]');
    otpInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });
  </script>
</body>
</html>
